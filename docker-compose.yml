# Local deployment. Three independently deployable roles: Temporal server, API, workers.
#   docker compose up --build -d
#   docker compose up -d --scale worker=3     # horizontal scale-out
# Temporal here is the CLI dev server persisted to a volume (single node, SQLite) -- fine for
# local work; production uses a real cluster backed by Postgres/Cassandra (see docs/ARCHITECTURE.md).
x-app: &app
  build: .
  environment: &env
    TEMPORAL_ADDRESS: temporal:7233
    TASK_QUEUE: json-workflows
    LOG_LEVEL: INFO
    DATA_DIR: /data
    ENABLE_FAULT_INJECTION: "1"   # demo only: enables the `_fault` input used by the crash demo. Never in production.
  volumes:
    - bizdata:/data               # shared "systems of record" for the demo business layer

services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/temporal-data/temporal.db"]
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # Web UI -> http://localhost:8233
    volumes:
      - temporal-data:/temporal-data

  api:
    <<: *app
    command: ["uvicorn", "wfengine.api:app_factory", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on: [temporal]

  worker:
    <<: *app
    command: ["python", "-m", "wfengine.worker"]
    environment:
      <<: *env
      GRACEFUL_SHUTDOWN_SECONDS: "30"
    stop_grace_period: 45s        # > GRACEFUL_SHUTDOWN_SECONDS so SIGTERM can drain before SIGKILL
    restart: unless-stopped
    depends_on: [temporal]

volumes:
  temporal-data:
  bizdata:
